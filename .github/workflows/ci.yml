name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Lint and smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning -Settings .\PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer clean.'

      - name: Validate config.example.json
        shell: pwsh
        run: Get-Content -Raw config.example.json | ConvertFrom-Json | Out-Null

      - name: Smoke test detection and DND modules
        shell: pwsh
        run: |
          . .\src\AutoDnd.Detection.ps1
          . .\src\AutoDnd.Dnd.ps1
          Get-ConsentStoreCaptureState | Out-Null
          $enabled = Get-NotificationsEnabled
          Write-Host "Notifications enabled on runner: $enabled"
          if (-not (Test-AppIsWatched -Identity 'C:\x\slack.exe' -Patterns @('slack\.exe$'))) { throw 'Watch matching broken.' }
          if (Test-AppIsWatched -Identity 'C:\x\obs.exe' -Patterns @('slack\.exe$')) { throw 'Watch matching too permissive.' }
          Write-Host 'Smoke test passed.'

      - name: Detection dry run
        shell: pwsh
        run: .\src\AutoDnd.ps1 -Once -NoAct
